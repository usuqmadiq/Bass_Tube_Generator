[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bass-tube"
version = "0.1.0"
description = "Параметрическая басовая труба под готовый модуль мембраны"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.8",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bass-tube = "bass_tube.ui.__main__:main"

[tool.setuptools.packages.find]
include = ["bass_tube*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["audit: большой аудит G1…G2 с дырками и парами, минуты; запуск: pytest -m audit"]
addopts = "-m \"not audit\""
